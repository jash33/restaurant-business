<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="weddingCeilingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#f8bbd9"/>
    </linearGradient>
    <linearGradient id="weddingFloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#efebe9"/>
      <stop offset="100%" style="stop-color:#d7ccc8"/>
    </linearGradient>
    <radialGradient id="weddingGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="drapeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="50%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#fff"/>
    </linearGradient>
  </defs>

  <!-- Ceiling -->
  <rect width="800" height="150" fill="url(#weddingCeilingGrad)"/>

  <!-- Draped ceiling fabric -->
  <path d="M0 0 Q200 100 400 50 Q600 0 800 80 L800 0 L0 0" fill="url(#drapeGrad)" opacity="0.7"/>
  <path d="M0 50 Q200 120 400 80 Q600 40 800 100" stroke="#f8bbd9" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Wall -->
  <rect x="0" y="120" width="800" height="280" fill="#fff5f8"/>

  <!-- Decorative columns -->
  <rect x="30" y="120" width="40" height="280" fill="#fce4ec"/>
  <rect x="730" y="120" width="40" height="280" fill="#fce4ec"/>
  <ellipse cx="50" cy="120" rx="25" ry="10" fill="#f8bbd9"/>
  <ellipse cx="750" cy="120" rx="25" ry="10" fill="#f8bbd9"/>

  <!-- Floor -->
  <rect x="0" y="400" width="800" height="200" fill="url(#weddingFloorGrad)"/>

  <!-- Large crystal chandelier -->
  <rect x="380" y="0" width="40" height="30" fill="#9e9e9e"/>
  <ellipse cx="400" cy="50" rx="80" ry="30" fill="#e0e0e0"/>
  <ellipse cx="400" cy="55" rx="70" ry="25" fill="#f5f5f5"/>

  <!-- Crystal strands -->
  <line x1="340" y1="55" x2="340" y2="90" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="340" cy="95" r="4" fill="#fff"/>
  <line x1="360" y1="60" x2="360" y2="100" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="360" cy="105" r="5" fill="#fff"/>
  <line x1="380" y1="65" x2="380" y2="110" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="380" cy="115" r="4" fill="#fff"/>
  <line x1="400" y1="68" x2="400" y2="115" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="400" cy="120" r="6" fill="#fff"/>
  <line x1="420" y1="65" x2="420" y2="110" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="420" cy="115" r="4" fill="#fff"/>
  <line x1="440" y1="60" x2="440" y2="100" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="440" cy="105" r="5" fill="#fff"/>
  <line x1="460" y1="55" x2="460" y2="90" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="460" cy="95" r="4" fill="#fff"/>

  <!-- Chandelier glow -->
  <ellipse cx="400" cy="85" rx="120" ry="60" fill="url(#weddingGlow)" opacity="0.5"/>

  <!-- Head table with draping -->
  <rect x="250" y="280" width="300" height="120" fill="#fff"/>
  <path d="M250 280 Q400 320 550 280" stroke="#f8bbd9" stroke-width="3" fill="none"/>
  <path d="M250 400 L250 350 Q400 420 550 350 L550 400" fill="#fff"/>

  <!-- Wedding cake on table -->
  <rect x="370" y="230" width="60" height="50" fill="#fff" stroke="#f8bbd9" stroke-width="2"/>
  <rect x="380" y="200" width="40" height="30" fill="#fff" stroke="#f8bbd9" stroke-width="2"/>
  <rect x="390" y="180" width="20" height="20" fill="#fff" stroke="#f8bbd9" stroke-width="2"/>
  <circle cx="400" cy="175" r="8" fill="#e91e63"/>

  <!-- Flower arrangements on head table -->
  <ellipse cx="290" cy="310" rx="30" ry="20" fill="#c8e6c9"/>
  <circle cx="280" cy="300" r="10" fill="#fff"/>
  <circle cx="300" cy="298" r="8" fill="#f8bbd9"/>
  <circle cx="290" cy="305" r="7" fill="#fff"/>

  <ellipse cx="510" cy="310" rx="30" ry="20" fill="#c8e6c9"/>
  <circle cx="500" cy="300" r="10" fill="#fff"/>
  <circle cx="520" cy="298" r="8" fill="#f8bbd9"/>
  <circle cx="510" cy="305" r="7" fill="#fff"/>

  <!-- Guest tables - round with white linens -->
  <!-- Left table -->
  <ellipse cx="150" cy="480" rx="80" ry="50" fill="#fff" stroke="#f8bbd9" stroke-width="2"/>
  <ellipse cx="150" cy="475" rx="25" ry="15" fill="#c8e6c9"/>
  <circle cx="145" cy="470" r="6" fill="#fff"/>
  <circle cx="155" cy="468" r="5" fill="#f8bbd9"/>

  <!-- Chairs around left table -->
  <ellipse cx="80" cy="460" rx="18" ry="12" fill="#fce4ec"/>
  <ellipse cx="100" cy="430" rx="18" ry="12" fill="#fce4ec"/>
  <ellipse cx="150" cy="420" rx="18" ry="12" fill="#fce4ec"/>
  <ellipse cx="200" cy="430" rx="18" ry="12" fill="#fce4ec"/>
  <ellipse cx="220" cy="460" rx="18" ry="12" fill="#fce4ec"/>

  <!-- Right table -->
  <ellipse cx="650" cy="480" rx="80" ry="50" fill="#fff" stroke="#f8bbd9" stroke-width="2"/>
  <ellipse cx="650" cy="475" rx="25" ry="15" fill="#c8e6c9"/>
  <circle cx="645" cy="470" r="6" fill="#fff"/>
  <circle cx="655" cy="468" r="5" fill="#f8bbd9"/>

  <!-- Chairs around right table -->
  <ellipse cx="580" cy="460" rx="18" ry="12" fill="#fce4ec"/>
  <ellipse cx="600" cy="430" rx="18" ry="12" fill="#fce4ec"/>
  <ellipse cx="650" cy="420" rx="18" ry="12" fill="#fce4ec"/>
  <ellipse cx="700" cy="430" rx="18" ry="12" fill="#fce4ec"/>
  <ellipse cx="720" cy="460" rx="18" ry="12" fill="#fce4ec"/>

  <!-- Dance floor indication -->
  <rect x="300" y="430" width="200" height="120" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="2"/>
  <rect x="300" y="430" width="50" height="40" fill="#fafafa"/>
  <rect x="350" y="470" width="50" height="40" fill="#fafafa"/>
  <rect x="400" y="430" width="50" height="40" fill="#fafafa"/>
  <rect x="450" y="470" width="50" height="40" fill="#fafafa"/>
  <rect x="300" y="510" width="50" height="40" fill="#fafafa"/>
  <rect x="400" y="510" width="50" height="40" fill="#fafafa"/>

  <!-- Rose petals scattered -->
  <ellipse cx="320" cy="450" rx="5" ry="3" fill="#f8bbd9" transform="rotate(30 320 450)"/>
  <ellipse cx="380" cy="480" rx="5" ry="3" fill="#f8bbd9" transform="rotate(-20 380 480)"/>
  <ellipse cx="420" cy="520" rx="5" ry="3" fill="#f8bbd9" transform="rotate(45 420 520)"/>
  <ellipse cx="470" cy="460" rx="5" ry="3" fill="#f8bbd9" transform="rotate(-35 470 460)"/>

  <!-- Fairy lights/warm ambiance -->
  <rect width="800" height="600" fill="#fff9c4" opacity="0.08"/>

  <!-- Text label -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#ad1457" opacity="0.9">Wedding Reception</text>
</svg>
