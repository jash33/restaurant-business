<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="corpWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#37474f"/>
      <stop offset="100%" style="stop-color:#263238"/>
    </linearGradient>
    <linearGradient id="corpFloorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3e2723"/>
      <stop offset="100%" style="stop-color:#2c1810"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <radialGradient id="spotlightGrad" cx="50%" cy="0%" r="80%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Ceiling -->
  <rect width="800" height="100" fill="#1a1a1a"/>

  <!-- Recessed lighting -->
  <rect x="150" y="85" width="60" height="15" fill="#333"/>
  <rect x="155" y="90" width="50" height="8" fill="#ffcc80"/>
  <rect x="370" y="85" width="60" height="15" fill="#333"/>
  <rect x="375" y="90" width="50" height="8" fill="#ffcc80"/>
  <rect x="590" y="85" width="60" height="15" fill="#333"/>
  <rect x="595" y="90" width="50" height="8" fill="#ffcc80"/>

  <!-- Wall -->
  <rect x="0" y="100" width="800" height="300" fill="url(#corpWallGrad)"/>

  <!-- Presentation screen -->
  <rect x="250" y="120" width="300" height="180" fill="#1a1a1a" stroke="#424242" stroke-width="5"/>
  <rect x="260" y="130" width="280" height="160" fill="url(#screenGrad)"/>

  <!-- Screen content - company logo/chart mockup -->
  <rect x="280" y="150" width="80" height="60" fill="#1976d2"/>
  <rect x="280" y="220" width="80" height="50" fill="#1976d2" opacity="0.7"/>
  <text x="320" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">Q4</text>
  <text x="320" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">2024</text>

  <!-- Chart bars -->
  <rect x="390" y="220" width="30" height="50" fill="#4caf50"/>
  <rect x="430" y="190" width="30" height="80" fill="#4caf50"/>
  <rect x="470" y="160" width="30" height="110" fill="#4caf50"/>

  <!-- Floor -->
  <rect x="0" y="400" width="800" height="200" fill="url(#corpFloorGrad)"/>

  <!-- Conference table - long rectangular -->
  <rect x="100" y="320" width="600" height="200" rx="10" fill="#5d4037" stroke="#4e342e" stroke-width="3"/>

  <!-- Table surface highlight -->
  <rect x="110" y="330" width="580" height="180" rx="5" fill="#6d4c41"/>

  <!-- Place settings - left side -->
  <ellipse cx="180" cy="380" rx="30" ry="20" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="220" y="375" width="40" height="5" fill="#9e9e9e"/>
  <rect x="220" y="385" width="40" height="3" fill="#9e9e9e"/>

  <ellipse cx="320" cy="380" rx="30" ry="20" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="360" y="375" width="40" height="5" fill="#9e9e9e"/>
  <rect x="360" y="385" width="40" height="3" fill="#9e9e9e"/>

  <ellipse cx="480" cy="380" rx="30" ry="20" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="520" y="375" width="40" height="5" fill="#9e9e9e"/>
  <rect x="520" y="385" width="40" height="3" fill="#9e9e9e"/>

  <ellipse cx="620" cy="380" rx="30" ry="20" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="560" y="375" width="40" height="5" fill="#9e9e9e"/>
  <rect x="560" y="385" width="40" height="3" fill="#9e9e9e"/>

  <!-- Place settings - right side -->
  <ellipse cx="180" cy="470" rx="30" ry="20" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <ellipse cx="320" cy="470" rx="30" ry="20" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <ellipse cx="480" cy="470" rx="30" ry="20" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <ellipse cx="620" cy="470" rx="30" ry="20" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Water glasses -->
  <rect x="200" y="360" width="12" height="20" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <rect x="340" y="360" width="12" height="20" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <rect x="500" y="360" width="12" height="20" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <rect x="640" y="360" width="12" height="20" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>

  <!-- Wine glasses -->
  <path d="M230 365 L230 375 L225 380 L235 380" stroke="#9e9e9e" stroke-width="1" fill="none"/>
  <ellipse cx="230" cy="360" rx="8" ry="5" fill="none" stroke="#9e9e9e" stroke-width="1"/>
  <path d="M370 365 L370 375 L365 380 L375 380" stroke="#9e9e9e" stroke-width="1" fill="none"/>
  <ellipse cx="370" cy="360" rx="8" ry="5" fill="none" stroke="#9e9e9e" stroke-width="1"/>

  <!-- Notepads and pens -->
  <rect x="155" y="400" width="25" height="35" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="160" y1="408" x2="175" y2="408" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="160" y1="415" x2="175" y2="415" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="160" y1="422" x2="175" y2="422" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="182" y="405" width="3" height="25" fill="#1565c0"/>

  <rect x="295" y="400" width="25" height="35" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="455" y="400" width="25" height="35" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="595" y="400" width="25" height="35" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Executive chairs -->
  <ellipse cx="180" cy="540" rx="35" ry="20" fill="#37474f"/>
  <rect x="160" y="500" width="40" height="40" fill="#455a64" rx="5"/>

  <ellipse cx="320" cy="540" rx="35" ry="20" fill="#37474f"/>
  <rect x="300" y="500" width="40" height="40" fill="#455a64" rx="5"/>

  <ellipse cx="480" cy="540" rx="35" ry="20" fill="#37474f"/>
  <rect x="460" y="500" width="40" height="40" fill="#455a64" rx="5"/>

  <ellipse cx="620" cy="540" rx="35" ry="20" fill="#37474f"/>
  <rect x="600" y="500" width="40" height="40" fill="#455a64" rx="5"/>

  <!-- Centerpiece - modern floral -->
  <rect x="385" y="410" width="30" height="25" fill="#455a64"/>
  <ellipse cx="400" cy="400" rx="20" ry="15" fill="#2e7d32"/>
  <circle cx="395" cy="395" r="5" fill="#fff"/>
  <circle cx="405" cy="393" r="4" fill="#bbdefb"/>

  <!-- Spotlight effect -->
  <rect width="800" height="600" fill="url(#spotlightGrad)"/>

  <!-- Subtle warm ambient -->
  <rect width="800" height="600" fill="#ff9800" opacity="0.04"/>

  <!-- Text label -->
  <text x="400" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#90a4ae">Corporate Dinner Event</text>
</svg>
