<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="barTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5d4037"/>
      <stop offset="100%" style="stop-color:#3e2723"/>
    </linearGradient>
    <linearGradient id="backBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a3728"/>
      <stop offset="100%" style="stop-color:#2d1f15"/>
    </linearGradient>
    <linearGradient id="bottleGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="100%" style="stop-color:#1b5e20"/>
    </linearGradient>
    <linearGradient id="bottleAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8f00"/>
      <stop offset="100%" style="stop-color:#e65100"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background wall -->
  <rect width="800" height="600" fill="#1a1410"/>

  <!-- Back bar shelving -->
  <rect x="50" y="80" width="700" height="280" fill="url(#backBar)"/>

  <!-- Shelves -->
  <rect x="50" y="140" width="700" height="8" fill="#5d4037"/>
  <rect x="50" y="210" width="700" height="8" fill="#5d4037"/>
  <rect x="50" y="280" width="700" height="8" fill="#5d4037"/>

  <!-- Mirror behind bar -->
  <rect x="100" y="90" width="600" height="40" fill="#2c3e50" opacity="0.5"/>

  <!-- Bottles on shelves - top shelf -->
  <rect x="120" y="100" width="20" height="35" fill="url(#bottleGreen)" rx="3"/>
  <rect x="160" y="105" width="18" height="30" fill="url(#bottleAmber)" rx="2"/>
  <rect x="200" y="102" width="22" height="33" fill="#4a148c" rx="3"/>
  <rect x="250" y="100" width="20" height="35" fill="url(#bottleGreen)" rx="3"/>
  <rect x="300" y="108" width="16" height="27" fill="#b71c1c" rx="2"/>
  <rect x="350" y="100" width="24" height="35" fill="url(#bottleAmber)" rx="3"/>
  <rect x="400" y="105" width="18" height="30" fill="#1565c0" rx="2"/>
  <rect x="450" y="100" width="20" height="35" fill="url(#bottleGreen)" rx="3"/>
  <rect x="500" y="102" width="22" height="33" fill="#4a148c" rx="3"/>
  <rect x="550" y="105" width="18" height="30" fill="url(#bottleAmber)" rx="2"/>
  <rect x="600" y="100" width="20" height="35" fill="#b71c1c" rx="3"/>
  <rect x="650" y="108" width="16" height="27" fill="url(#bottleGreen)" rx="2"/>

  <!-- Bottles - middle shelf -->
  <rect x="100" y="170" width="24" height="35" fill="url(#bottleAmber)" rx="3"/>
  <rect x="140" y="175" width="20" height="30" fill="url(#bottleGreen)" rx="2"/>
  <rect x="180" y="168" width="26" height="37" fill="#311b92" rx="3"/>
  <rect x="230" y="172" width="22" height="33" fill="url(#bottleAmber)" rx="3"/>
  <rect x="280" y="175" width="18" height="30" fill="#c62828" rx="2"/>
  <rect x="330" y="168" width="24" height="37" fill="url(#bottleGreen)" rx="3"/>
  <rect x="380" y="170" width="20" height="35" fill="#0d47a1" rx="2"/>
  <rect x="420" y="175" width="22" height="30" fill="url(#bottleAmber)" rx="3"/>
  <rect x="470" y="168" width="26" height="37" fill="#4a148c" rx="3"/>
  <rect x="520" y="172" width="20" height="33" fill="url(#bottleGreen)" rx="2"/>
  <rect x="570" y="175" width="24" height="30" fill="url(#bottleAmber)" rx="3"/>
  <rect x="620" y="168" width="22" height="37" fill="#b71c1c" rx="3"/>
  <rect x="670" y="172" width="18" height="33" fill="url(#bottleGreen)" rx="2"/>

  <!-- Wine glasses hanging -->
  <path d="M150 85 L150 70 L145 65 L155 65 L150 70" stroke="#ccc" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M180 85 L180 70 L175 65 L185 65 L180 70" stroke="#ccc" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M350 85 L350 70 L345 65 L355 65 L350 70" stroke="#ccc" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M380 85 L380 70 L375 65 L385 65 L380 70" stroke="#ccc" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M550 85 L550 70 L545 65 L555 65 L550 70" stroke="#ccc" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M580 85 L580 70 L575 65 L585 65 L580 70" stroke="#ccc" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Bar counter -->
  <rect x="0" y="360" width="800" height="30" fill="url(#barTop)"/>
  <rect x="0" y="390" width="800" height="180" fill="#2d1f15"/>

  <!-- Bar front detail -->
  <rect x="50" y="400" width="3" height="160" fill="#3e2723"/>
  <rect x="150" y="400" width="3" height="160" fill="#3e2723"/>
  <rect x="250" y="400" width="3" height="160" fill="#3e2723"/>
  <rect x="350" y="400" width="3" height="160" fill="#3e2723"/>
  <rect x="450" y="400" width="3" height="160" fill="#3e2723"/>
  <rect x="550" y="400" width="3" height="160" fill="#3e2723"/>
  <rect x="650" y="400" width="3" height="160" fill="#3e2723"/>
  <rect x="750" y="400" width="3" height="160" fill="#3e2723"/>

  <!-- Bar stools -->
  <circle cx="150" cy="520" r="25" fill="#1a1a1a"/>
  <rect x="145" y="520" width="10" height="60" fill="#333"/>
  <circle cx="300" cy="520" r="25" fill="#1a1a1a"/>
  <rect x="295" y="520" width="10" height="60" fill="#333"/>
  <circle cx="450" cy="520" r="25" fill="#1a1a1a"/>
  <rect x="445" y="520" width="10" height="60" fill="#333"/>
  <circle cx="600" cy="520" r="25" fill="#1a1a1a"/>
  <rect x="595" y="520" width="10" height="60" fill="#333"/>

  <!-- Drinks on bar -->
  <ellipse cx="200" cy="355" rx="15" ry="8" fill="#333"/>
  <rect x="190" y="330" width="20" height="25" fill="#8b4513" opacity="0.8"/>
  <ellipse cx="400" cy="355" rx="12" ry="6" fill="#333"/>
  <path d="M390 355 L395 320 L405 320 L410 355" fill="none" stroke="#ccc" stroke-width="1"/>
  <ellipse cx="400" cy="320" rx="10" ry="5" fill="#722f37"/>
  <ellipse cx="550" cy="355" rx="18" ry="9" fill="#333"/>
  <rect x="535" y="325" width="30" height="30" fill="#ffd54f" rx="2"/>

  <!-- Spotlight effect -->
  <rect width="800" height="600" fill="url(#spotlight)"/>

  <!-- Warm ambiance -->
  <rect width="800" height="600" fill="#ff6f00" opacity="0.08"/>

  <!-- Text label -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#d4c4a8" opacity="0.9">Craft Bar &amp; Lounge</text>
</svg>
