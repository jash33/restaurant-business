<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="daySkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb"/>
      <stop offset="100%" style="stop-color:#e0f7fa"/>
    </linearGradient>
    <linearGradient id="umbrellaRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f"/>
      <stop offset="100%" style="stop-color:#b71c1c"/>
    </linearGradient>
    <linearGradient id="umbrellaWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#f5f5f5"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9e9e9e"/>
      <stop offset="100%" style="stop-color:#757575"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="350" fill="url(#daySkyGrad)"/>

  <!-- Sun -->
  <circle cx="650" cy="80" r="50" fill="#fff59d"/>
  <circle cx="650" cy="80" r="40" fill="#ffeb3b"/>

  <!-- Clouds -->
  <ellipse cx="150" cy="60" rx="60" ry="25" fill="#fff" opacity="0.9"/>
  <ellipse cx="120" cy="70" rx="40" ry="20" fill="#fff" opacity="0.9"/>
  <ellipse cx="180" cy="70" rx="45" ry="22" fill="#fff" opacity="0.9"/>

  <ellipse cx="450" cy="100" rx="50" ry="20" fill="#fff" opacity="0.8"/>
  <ellipse cx="420" cy="110" rx="35" ry="18" fill="#fff" opacity="0.8"/>

  <!-- Background building -->
  <rect x="0" y="200" width="800" height="200" fill="#8d6e63"/>
  <rect x="50" y="220" width="100" height="80" fill="#5d4037"/>
  <rect x="200" y="220" width="100" height="80" fill="#5d4037"/>
  <rect x="500" y="220" width="100" height="80" fill="#5d4037"/>
  <rect x="650" y="220" width="100" height="80" fill="#5d4037"/>

  <!-- Patio floor -->
  <rect x="0" y="350" width="800" height="250" fill="url(#stoneGrad)"/>

  <!-- Stone pattern -->
  <g stroke="#616161" stroke-width="1" fill="none" opacity="0.3">
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="350" x2="100" y2="600"/>
    <line x1="200" y1="350" x2="200" y2="600"/>
    <line x1="300" y1="350" x2="300" y2="600"/>
    <line x1="400" y1="350" x2="400" y2="600"/>
    <line x1="500" y1="350" x2="500" y2="600"/>
    <line x1="600" y1="350" x2="600" y2="600"/>
    <line x1="700" y1="350" x2="700" y2="600"/>
  </g>

  <!-- Railing -->
  <rect x="0" y="340" width="800" height="15" fill="#5d4037"/>
  <rect x="50" y="310" width="8" height="45" fill="#5d4037"/>
  <rect x="150" y="310" width="8" height="45" fill="#5d4037"/>
  <rect x="250" y="310" width="8" height="45" fill="#5d4037"/>
  <rect x="350" y="310" width="8" height="45" fill="#5d4037"/>
  <rect x="450" y="310" width="8" height="45" fill="#5d4037"/>
  <rect x="550" y="310" width="8" height="45" fill="#5d4037"/>
  <rect x="650" y="310" width="8" height="45" fill="#5d4037"/>
  <rect x="750" y="310" width="8" height="45" fill="#5d4037"/>
  <rect x="0" y="310" width="800" height="8" fill="#5d4037"/>

  <!-- Umbrella 1 (left) -->
  <polygon points="100,250 250,250 200,380 150,380" fill="url(#umbrellaRed)"/>
  <polygon points="175,250 175,380" stroke="#8b0000" stroke-width="2"/>
  <rect x="172" y="380" width="6" height="120" fill="#5d4037"/>

  <!-- Umbrella 2 (center) -->
  <polygon points="320,230 520,230 480,390 360,390" fill="url(#umbrellaWhite)"/>
  <polygon points="360,230 420,230 400,390 380,390" fill="#e0e0e0"/>
  <polygon points="440,230 500,230 480,390 420,390" fill="#e0e0e0"/>
  <rect x="417" y="390" width="6" height="100" fill="#5d4037"/>

  <!-- Umbrella 3 (right) -->
  <polygon points="580,250 730,250 680,380 630,380" fill="url(#umbrellaRed)"/>
  <polygon points="655,250 655,380" stroke="#8b0000" stroke-width="2"/>
  <rect x="652" y="380" width="6" height="120" fill="#5d4037"/>

  <!-- Table 1 (left) -->
  <ellipse cx="175" cy="480" rx="60" ry="30" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <!-- Chairs -->
  <ellipse cx="120" cy="520" rx="25" ry="15" fill="#4e342e"/>
  <ellipse cx="230" cy="520" rx="25" ry="15" fill="#4e342e"/>
  <!-- Table items -->
  <ellipse cx="175" cy="475" rx="15" ry="8" fill="#f5f5dc"/>
  <rect x="155" y="460" width="8" height="12" fill="#e91e63"/>

  <!-- Table 2 (center) -->
  <ellipse cx="420" cy="470" rx="70" ry="35" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <!-- Chairs -->
  <ellipse cx="350" cy="510" rx="25" ry="15" fill="#4e342e"/>
  <ellipse cx="490" cy="510" rx="25" ry="15" fill="#4e342e"/>
  <ellipse cx="420" cy="540" rx="25" ry="15" fill="#4e342e"/>
  <!-- Table items -->
  <ellipse cx="400" cy="460" rx="20" ry="10" fill="#f5f5dc"/>
  <ellipse cx="440" cy="465" rx="18" ry="9" fill="#f5f5dc"/>
  <path d="M420 455 L420 445 L415 440 L425 440" stroke="#666" stroke-width="1" fill="none"/>
  <ellipse cx="420" cy="440" rx="8" ry="4" fill="#722f37"/>

  <!-- Table 3 (right) -->
  <ellipse cx="655" cy="480" rx="60" ry="30" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <!-- Chairs -->
  <ellipse cx="600" cy="520" rx="25" ry="15" fill="#4e342e"/>
  <ellipse cx="710" cy="520" rx="25" ry="15" fill="#4e342e"/>
  <!-- Table items -->
  <ellipse cx="655" cy="475" rx="15" ry="8" fill="#f5f5dc"/>

  <!-- Potted plants -->
  <rect x="40" y="520" width="30" height="35" fill="#8d6e63"/>
  <ellipse cx="55" cy="510" rx="25" ry="20" fill="#2e7d32"/>
  <ellipse cx="50" cy="505" rx="8" ry="10" fill="#388e3c"/>
  <ellipse cx="60" cy="500" rx="10" ry="12" fill="#43a047"/>

  <rect x="730" y="520" width="30" height="35" fill="#8d6e63"/>
  <ellipse cx="745" cy="510" rx="25" ry="20" fill="#2e7d32"/>
  <ellipse cx="740" cy="505" rx="8" ry="10" fill="#388e3c"/>
  <ellipse cx="750" cy="500" rx="10" ry="12" fill="#43a047"/>

  <!-- String lights -->
  <path d="M50 280 Q200 260 400 280 Q600 300 750 275" stroke="#333" stroke-width="2" fill="none"/>
  <circle cx="100" cy="275" r="5" fill="#fff9c4"/>
  <circle cx="180" cy="268" r="5" fill="#fff9c4"/>
  <circle cx="260" cy="272" r="5" fill="#fff9c4"/>
  <circle cx="340" cy="278" r="5" fill="#fff9c4"/>
  <circle cx="420" cy="282" r="5" fill="#fff9c4"/>
  <circle cx="500" cy="285" r="5" fill="#fff9c4"/>
  <circle cx="580" cy="283" r="5" fill="#fff9c4"/>
  <circle cx="660" cy="278" r="5" fill="#fff9c4"/>
  <circle cx="720" cy="276" r="5" fill="#fff9c4"/>

  <!-- Text label -->
  <text x="400" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#424242">Outdoor Patio Dining</text>
</svg>
