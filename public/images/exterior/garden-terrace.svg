<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="eveningSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="40%" style="stop-color:#5c6bc0"/>
      <stop offset="70%" style="stop-color:#ff8a65"/>
      <stop offset="100%" style="stop-color:#ffcc80"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="hedgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#388e3c"/>
      <stop offset="100%" style="stop-color:#1b5e20"/>
    </linearGradient>
    <radialGradient id="stringLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff9c4"/>
      <stop offset="100%" style="stop-color:#fff9c4;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Sunset sky -->
  <rect width="800" height="400" fill="url(#eveningSkyGrad)"/>

  <!-- Stars (appearing in darker part) -->
  <circle cx="100" cy="50" r="1" fill="#fff"/>
  <circle cx="200" cy="30" r="1.5" fill="#fff"/>
  <circle cx="300" cy="60" r="1" fill="#fff"/>
  <circle cx="450" cy="40" r="1" fill="#fff"/>
  <circle cx="550" cy="55" r="1.5" fill="#fff"/>
  <circle cx="700" cy="35" r="1" fill="#fff"/>

  <!-- Distant trees silhouette -->
  <ellipse cx="100" cy="280" rx="80" ry="100" fill="#1b5e20" opacity="0.6"/>
  <ellipse cx="250" cy="290" rx="100" ry="120" fill="#1b5e20" opacity="0.5"/>
  <ellipse cx="600" cy="285" rx="90" ry="110" fill="#1b5e20" opacity="0.6"/>
  <ellipse cx="720" cy="300" rx="70" ry="90" fill="#1b5e20" opacity="0.5"/>

  <!-- Hedge border -->
  <rect x="0" y="340" width="800" height="60" fill="url(#hedgeGrad)"/>
  <ellipse cx="50" cy="340" rx="40" ry="30" fill="#388e3c"/>
  <ellipse cx="150" cy="345" rx="45" ry="35" fill="#43a047"/>
  <ellipse cx="250" cy="340" rx="40" ry="30" fill="#388e3c"/>
  <ellipse cx="350" cy="345" rx="45" ry="35" fill="#43a047"/>
  <ellipse cx="450" cy="340" rx="40" ry="30" fill="#388e3c"/>
  <ellipse cx="550" cy="345" rx="45" ry="35" fill="#43a047"/>
  <ellipse cx="650" cy="340" rx="40" ry="30" fill="#388e3c"/>
  <ellipse cx="750" cy="345" rx="45" ry="35" fill="#43a047"/>

  <!-- Grass lawn -->
  <rect x="0" y="380" width="800" height="220" fill="url(#grassGrad)"/>

  <!-- Stone path -->
  <ellipse cx="400" cy="550" rx="200" ry="40" fill="#9e9e9e"/>
  <ellipse cx="400" cy="500" rx="150" ry="30" fill="#bdbdbd"/>
  <ellipse cx="400" cy="460" rx="100" ry="20" fill="#e0e0e0"/>

  <!-- Pergola structure -->
  <rect x="100" y="250" width="20" height="200" fill="#5d4037"/>
  <rect x="680" y="250" width="20" height="200" fill="#5d4037"/>
  <rect x="100" y="250" width="600" height="15" fill="#6d4c41"/>

  <!-- Cross beams -->
  <rect x="100" y="255" width="600" height="8" fill="#5d4037"/>
  <rect x="150" y="250" width="8" height="15" fill="#5d4037"/>
  <rect x="250" y="250" width="8" height="15" fill="#5d4037"/>
  <rect x="350" y="250" width="8" height="15" fill="#5d4037"/>
  <rect x="450" y="250" width="8" height="15" fill="#5d4037"/>
  <rect x="550" y="250" width="8" height="15" fill="#5d4037"/>
  <rect x="650" y="250" width="8" height="15" fill="#5d4037"/>

  <!-- Hanging vines/greenery -->
  <path d="M150 265 Q160 300 150 330" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <path d="M155 265 Q165 290 160 310" stroke="#388e3c" stroke-width="2" fill="none"/>
  <path d="M250 265 Q260 310 250 340" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <path d="M350 265 Q360 295 355 320" stroke="#388e3c" stroke-width="3" fill="none"/>
  <path d="M450 265 Q440 300 450 330" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <path d="M550 265 Q560 310 555 340" stroke="#388e3c" stroke-width="3" fill="none"/>
  <path d="M650 265 Q640 290 645 320" stroke="#2e7d32" stroke-width="2" fill="none"/>

  <!-- String lights on pergola -->
  <path d="M120 268 Q400 290 680 268" stroke="#333" stroke-width="2" fill="none"/>
  <circle cx="160" cy="272" r="6" fill="url(#stringLight)"/>
  <circle cx="160" cy="272" r="3" fill="#fff9c4"/>
  <circle cx="240" cy="278" r="6" fill="url(#stringLight)"/>
  <circle cx="240" cy="278" r="3" fill="#fff9c4"/>
  <circle cx="320" cy="282" r="6" fill="url(#stringLight)"/>
  <circle cx="320" cy="282" r="3" fill="#fff9c4"/>
  <circle cx="400" cy="284" r="6" fill="url(#stringLight)"/>
  <circle cx="400" cy="284" r="3" fill="#fff9c4"/>
  <circle cx="480" cy="282" r="6" fill="url(#stringLight)"/>
  <circle cx="480" cy="282" r="3" fill="#fff9c4"/>
  <circle cx="560" cy="278" r="6" fill="url(#stringLight)"/>
  <circle cx="560" cy="278" r="3" fill="#fff9c4"/>
  <circle cx="640" cy="272" r="6" fill="url(#stringLight)"/>
  <circle cx="640" cy="272" r="3" fill="#fff9c4"/>

  <!-- Dining tables under pergola -->
  <!-- Table 1 -->
  <ellipse cx="250" cy="420" rx="60" ry="30" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <ellipse cx="200" cy="450" rx="20" ry="12" fill="#5d4037"/>
  <ellipse cx="300" cy="450" rx="20" ry="12" fill="#5d4037"/>
  <!-- Candle -->
  <rect x="245" y="400" width="10" height="15" fill="#fff"/>
  <circle cx="250" cy="395" r="8" fill="url(#stringLight)"/>

  <!-- Table 2 -->
  <ellipse cx="400" cy="400" rx="70" ry="35" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <ellipse cx="340" cy="440" rx="20" ry="12" fill="#5d4037"/>
  <ellipse cx="460" cy="440" rx="20" ry="12" fill="#5d4037"/>
  <ellipse cx="400" cy="460" rx="20" ry="12" fill="#5d4037"/>
  <!-- Flowers centerpiece -->
  <ellipse cx="400" cy="390" rx="20" ry="12" fill="#2e7d32"/>
  <circle cx="395" cy="385" r="5" fill="#e91e63"/>
  <circle cx="405" cy="383" r="4" fill="#9c27b0"/>
  <circle cx="400" cy="388" r="4" fill="#f44336"/>

  <!-- Table 3 -->
  <ellipse cx="550" cy="420" rx="60" ry="30" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <ellipse cx="500" cy="450" rx="20" ry="12" fill="#5d4037"/>
  <ellipse cx="600" cy="450" rx="20" ry="12" fill="#5d4037"/>
  <!-- Candle -->
  <rect x="545" y="400" width="10" height="15" fill="#fff"/>
  <circle cx="550" cy="395" r="8" fill="url(#stringLight)"/>

  <!-- Flower beds -->
  <ellipse cx="80" cy="480" rx="50" ry="25" fill="#2e7d32"/>
  <circle cx="65" cy="470" r="8" fill="#e91e63"/>
  <circle cx="80" cy="465" r="6" fill="#ff9800"/>
  <circle cx="95" cy="472" r="7" fill="#9c27b0"/>
  <circle cx="75" cy="480" r="5" fill="#f44336"/>

  <ellipse cx="720" cy="480" rx="50" ry="25" fill="#2e7d32"/>
  <circle cx="705" cy="470" r="8" fill="#ff9800"/>
  <circle cx="720" cy="465" r="6" fill="#e91e63"/>
  <circle cx="735" cy="472" r="7" fill="#f44336"/>
  <circle cx="725" cy="480" r="5" fill="#9c27b0"/>

  <!-- Ambient warm glow -->
  <rect width="800" height="600" fill="#ff6f00" opacity="0.08"/>

  <!-- Text label -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#fff" opacity="0.9">Garden Terrace at Sunset</text>
</svg>
