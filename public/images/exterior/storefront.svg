<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#3949ab"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5d4037"/>
      <stop offset="100%" style="stop-color:#4e342e"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9c4"/>
      <stop offset="100%" style="stop-color:#ffcc80"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff9c4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fff9c4;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Night sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle cx="100" cy="50" r="1" fill="#fff"/>
  <circle cx="200" cy="80" r="1.5" fill="#fff"/>
  <circle cx="350" cy="40" r="1" fill="#fff"/>
  <circle cx="500" cy="60" r="1.5" fill="#fff"/>
  <circle cx="650" cy="45" r="1" fill="#fff"/>
  <circle cx="750" cy="90" r="1" fill="#fff"/>
  <circle cx="50" cy="120" r="1" fill="#fff"/>
  <circle cx="700" cy="30" r="1.5" fill="#fff"/>

  <!-- Building -->
  <rect x="50" y="150" width="700" height="400" fill="url(#brickGrad)"/>

  <!-- Brick pattern -->
  <g fill="none" stroke="#3e2723" stroke-width="1" opacity="0.3">
    <line x1="50" y1="180" x2="750" y2="180"/>
    <line x1="50" y1="210" x2="750" y2="210"/>
    <line x1="50" y1="240" x2="750" y2="240"/>
    <line x1="50" y1="270" x2="750" y2="270"/>
  </g>

  <!-- Awning -->
  <polygon points="30,300 770,300 750,350 50,350" fill="#8b0000"/>
  <polygon points="30,300 770,300 770,310 30,310" fill="#6b0000"/>
  <!-- Awning stripes -->
  <rect x="100" y="310" width="40" height="40" fill="#a00000"/>
  <rect x="200" y="310" width="40" height="40" fill="#a00000"/>
  <rect x="300" y="310" width="40" height="40" fill="#a00000"/>
  <rect x="400" y="310" width="40" height="40" fill="#a00000"/>
  <rect x="500" y="310" width="40" height="40" fill="#a00000"/>
  <rect x="600" y="310" width="40" height="40" fill="#a00000"/>
  <rect x="700" y="310" width="40" height="40" fill="#a00000"/>

  <!-- Upper windows -->
  <rect x="120" y="180" width="80" height="100" fill="url(#windowGlow)" opacity="0.9"/>
  <rect x="120" y="180" width="80" height="100" fill="none" stroke="#2c2c2c" stroke-width="4"/>
  <line x1="160" y1="180" x2="160" y2="280" stroke="#2c2c2c" stroke-width="3"/>
  <line x1="120" y1="230" x2="200" y2="230" stroke="#2c2c2c" stroke-width="3"/>

  <rect x="360" y="180" width="80" height="100" fill="url(#windowGlow)" opacity="0.9"/>
  <rect x="360" y="180" width="80" height="100" fill="none" stroke="#2c2c2c" stroke-width="4"/>
  <line x1="400" y1="180" x2="400" y2="280" stroke="#2c2c2c" stroke-width="3"/>
  <line x1="360" y1="230" x2="440" y2="230" stroke="#2c2c2c" stroke-width="3"/>

  <rect x="600" y="180" width="80" height="100" fill="url(#windowGlow)" opacity="0.9"/>
  <rect x="600" y="180" width="80" height="100" fill="none" stroke="#2c2c2c" stroke-width="4"/>
  <line x1="640" y1="180" x2="640" y2="280" stroke="#2c2c2c" stroke-width="3"/>
  <line x1="600" y1="230" x2="680" y2="230" stroke="#2c2c2c" stroke-width="3"/>

  <!-- Large front windows -->
  <rect x="80" y="360" width="200" height="180" fill="url(#windowGlow)" opacity="0.85"/>
  <rect x="80" y="360" width="200" height="180" fill="none" stroke="#2c2c2c" stroke-width="5"/>
  <line x1="180" y1="360" x2="180" y2="540" stroke="#2c2c2c" stroke-width="4"/>

  <rect x="520" y="360" width="200" height="180" fill="url(#windowGlow)" opacity="0.85"/>
  <rect x="520" y="360" width="200" height="180" fill="none" stroke="#2c2c2c" stroke-width="5"/>
  <line x1="620" y1="360" x2="620" y2="540" stroke="#2c2c2c" stroke-width="4"/>

  <!-- Main entrance door -->
  <rect x="330" y="370" width="140" height="180" fill="#2c2c2c"/>
  <rect x="340" y="380" width="55" height="160" fill="url(#windowGlow)" opacity="0.7"/>
  <rect x="405" y="380" width="55" height="160" fill="url(#windowGlow)" opacity="0.7"/>
  <circle cx="390" cy="470" r="8" fill="#c9a227"/>
  <circle cx="410" cy="470" r="8" fill="#c9a227"/>

  <!-- Door frame -->
  <rect x="320" y="355" width="160" height="20" fill="#2c2c2c"/>

  <!-- Restaurant name sign -->
  <rect x="280" y="150" width="240" height="50" fill="#1a1a1a" stroke="#c9a227" stroke-width="3"/>
  <text x="400" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#c9a227">LA MAISON</text>

  <!-- Wall lamps -->
  <rect x="70" y="320" width="20" height="30" fill="#2c2c2c"/>
  <circle cx="80" cy="340" r="25" fill="url(#lampGlow)"/>
  <ellipse cx="80" cy="330" rx="8" ry="12" fill="#fff9c4"/>

  <rect x="710" y="320" width="20" height="30" fill="#2c2c2c"/>
  <circle cx="720" cy="340" r="25" fill="url(#lampGlow)"/>
  <ellipse cx="720" cy="330" rx="8" ry="12" fill="#fff9c4"/>

  <!-- Sidewalk -->
  <rect x="0" y="550" width="800" height="50" fill="#757575"/>
  <line x1="0" y1="565" x2="800" y2="565" stroke="#616161" stroke-width="2"/>

  <!-- Planters -->
  <rect x="300" y="530" width="40" height="25" fill="#4e342e"/>
  <ellipse cx="320" cy="525" rx="25" ry="15" fill="#2e7d32"/>
  <circle cx="315" cy="520" r="5" fill="#e91e63"/>
  <circle cx="325" cy="518" r="4" fill="#ff9800"/>

  <rect x="460" y="530" width="40" height="25" fill="#4e342e"/>
  <ellipse cx="480" cy="525" rx="25" ry="15" fill="#2e7d32"/>
  <circle cx="475" cy="520" r="5" fill="#e91e63"/>
  <circle cx="485" cy="518" r="4" fill="#ff9800"/>

  <!-- Text label -->
  <text x="400" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#e0e0e0" opacity="0.9">Evening at La Maison</text>
</svg>
