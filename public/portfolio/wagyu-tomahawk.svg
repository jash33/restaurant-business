<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad1)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1c1c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Cutting board -->
  <rect x="150" y="130" width="300" height="180" rx="15" fill="#8b6914" opacity="0.3"/>
  <!-- Steak -->
  <ellipse cx="300" cy="210" rx="100" ry="60" fill="#8b2500" opacity="0.6"/>
  <ellipse cx="300" cy="205" rx="90" ry="50" fill="#a0522d" opacity="0.5"/>
  <!-- Bone -->
  <rect x="390" y="180" width="80" height="12" rx="6" fill="#fff" opacity="0.35"/>
  <circle cx="475" cy="186" r="10" fill="#fff" opacity="0.25"/>
  <!-- Grill marks -->
  <line x1="240" y1="190" x2="360" y2="190" stroke="#3d1c00" stroke-width="3" opacity="0.4"/>
  <line x1="245" y1="210" x2="355" y2="210" stroke="#3d1c00" stroke-width="3" opacity="0.4"/>
  <line x1="250" y1="230" x2="350" y2="230" stroke="#3d1c00" stroke-width="3" opacity="0.4"/>
  <!-- Herb garnish -->
  <circle cx="210" cy="260" r="6" fill="#2e8b57" opacity="0.5"/>
  <circle cx="225" cy="255" r="5" fill="#3cb371" opacity="0.5"/>
  <circle cx="218" cy="248" r="4" fill="#2e8b57" opacity="0.4"/>
  <!-- Steam -->
  <path d="M280 150 Q285 130 290 150" stroke="#fff" stroke-width="2" opacity="0.25" fill="none"/>
  <path d="M310 145 Q315 125 320 145" stroke="#fff" stroke-width="2" opacity="0.25" fill="none"/>
  <!-- Fire icon -->
  <path d="M300 60 Q310 45 305 70 Q320 55 310 80 Q300 65 295 80 Q285 55 300 60Z" fill="#ff6347" opacity="0.5"/>
  <!-- Text -->
  <text x="300" y="340" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">Wagyu Tomahawk Steak</text>
  <text x="300" y="365" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">Dry-Aged 45 Days • Wood-Fired</text>
</svg>