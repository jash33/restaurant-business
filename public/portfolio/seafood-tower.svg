<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad1)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006994;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Stand/pillar -->
  <rect x="290" y="100" width="20" height="180" fill="#c0c0c0" opacity="0.2"/>
  <!-- Top tier -->
  <ellipse cx="300" cy="100" rx="60" ry="25" fill="#c0c0c0" opacity="0.15"/>
  <ellipse cx="300" cy="95" rx="55" ry="20" fill="#e0f0ff" opacity="0.1"/>
  <!-- Middle tier -->
  <ellipse cx="300" cy="170" rx="80" ry="30" fill="#c0c0c0" opacity="0.15"/>
  <ellipse cx="300" cy="165" rx="75" ry="25" fill="#e0f0ff" opacity="0.1"/>
  <!-- Bottom tier -->
  <ellipse cx="300" cy="250" rx="100" ry="35" fill="#c0c0c0" opacity="0.15"/>
  <ellipse cx="300" cy="245" rx="95" ry="30" fill="#e0f0ff" opacity="0.1"/>
  <!-- Oysters (bottom) -->
  <ellipse cx="240" cy="240" rx="12" ry="7" fill="#d2b48c" opacity="0.3" transform="rotate(-20 240 240)"/>
  <ellipse cx="270" cy="248" rx="12" ry="7" fill="#d2b48c" opacity="0.25" transform="rotate(10 270 248)"/>
  <ellipse cx="330" cy="248" rx="12" ry="7" fill="#d2b48c" opacity="0.25" transform="rotate(-10 330 248)"/>
  <ellipse cx="360" cy="240" rx="12" ry="7" fill="#d2b48c" opacity="0.3" transform="rotate(20 360 240)"/>
  <!-- Shrimp (middle) -->
  <path d="M260 160 Q250 150 260 145 Q270 150 260 160" fill="#ff6347" opacity="0.35"/>
  <path d="M290 162 Q280 152 290 147 Q300 152 290 162" fill="#ff6347" opacity="0.3"/>
  <path d="M320 160 Q310 150 320 145 Q330 150 320 160" fill="#ff6347" opacity="0.35"/>
  <!-- Crab legs (top) -->
  <line x1="275" y1="95" x2="255" y2="80" stroke="#ff4500" stroke-width="3" opacity="0.3"/>
  <line x1="300" y1="90" x2="300" y2="72" stroke="#ff4500" stroke-width="3" opacity="0.3"/>
  <line x1="325" y1="95" x2="345" y2="80" stroke="#ff4500" stroke-width="3" opacity="0.3"/>
  <!-- Lemon wedge -->
  <path d="M380 230 A15 15 0 0 1 395 245 L380 245 Z" fill="#FFD700" opacity="0.35"/>
  <!-- Ice sparkles -->
  <circle cx="230" cy="255" r="2" fill="#fff" opacity="0.3"/>
  <circle cx="350" cy="250" r="1.5" fill="#fff" opacity="0.25"/>
  <circle cx="280" cy="175" r="1.5" fill="#fff" opacity="0.2"/>
  <!-- Text -->
  <text x="300" y="340" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">Gulf Coast Seafood Tower</text>
  <text x="300" y="365" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">Sustainably Sourced • Three Tiers</text>
</svg>