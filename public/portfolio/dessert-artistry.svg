<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad1)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3c1053;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ad5389;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main plate -->
  <ellipse cx="300" cy="220" rx="120" ry="70" fill="#fff" opacity="0.1"/>
  <ellipse cx="300" cy="215" rx="110" ry="62" fill="#fff" opacity="0.06"/>
  <!-- Chocolate lava cake -->
  <rect x="265" y="175" width="70" height="50" rx="10" fill="#3d1c02" opacity="0.5"/>
  <ellipse cx="300" cy="175" rx="38" ry="15" fill="#4a2c0a" opacity="0.4"/>
  <!-- Chocolate flowing -->
  <path d="M290 180 Q295 190 292 200" stroke="#5c3317" stroke-width="4" opacity="0.35" fill="none"/>
  <path d="M310 178 Q313 188 315 198" stroke="#5c3317" stroke-width="3" opacity="0.3" fill="none"/>
  <!-- Ice cream scoop -->
  <circle cx="355" cy="200" r="18" fill="#f5deb3" opacity="0.3"/>
  <circle cx="355" cy="198" r="16" fill="#fff" opacity="0.15"/>
  <!-- Sauce swirl -->
  <path d="M220 230 Q240 210 260 230 Q280 250 300 230" stroke="#8b0000" stroke-width="2" opacity="0.25" fill="none"/>
  <!-- Berries -->
  <circle cx="240" cy="210" r="5" fill="#dc143c" opacity="0.35"/>
  <circle cx="250" cy="218" r="4" fill="#dc143c" opacity="0.3"/>
  <circle cx="232" cy="220" r="4" fill="#8b0000" opacity="0.3"/>
  <!-- Mint leaf -->
  <ellipse cx="340" cy="185" rx="8" ry="4" fill="#228b22" opacity="0.4" transform="rotate(-30 340 185)"/>
  <!-- Gold dust particles -->
  <circle cx="280" cy="170" r="1" fill="#FFD700" opacity="0.5"/>
  <circle cx="310" cy="168" r="1" fill="#FFD700" opacity="0.4"/>
  <circle cx="295" cy="165" r="1.5" fill="#FFD700" opacity="0.45"/>
  <circle cx="320" cy="172" r="1" fill="#FFD700" opacity="0.35"/>
  <!-- Decorative sugar work -->
  <path d="M300 130 Q310 120 320 135 Q325 145 315 140" stroke="#c9a84c" stroke-width="1.5" opacity="0.25" fill="none"/>
  <!-- Text -->
  <text x="300" y="340" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">Artisan Desserts</text>
  <text x="300" y="365" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">Pastry Chef Creations • Visual Artistry</text>
</svg>