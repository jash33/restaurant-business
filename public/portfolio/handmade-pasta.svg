<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad1)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c3317;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Bowl -->
  <ellipse cx="300" cy="230" rx="120" ry="70" fill="#fff" opacity="0.12"/>
  <ellipse cx="300" cy="220" rx="110" ry="60" fill="#fff" opacity="0.08"/>
  <!-- Pasta strands -->
  <path d="M220 200 Q260 170 300 200 Q340 230 380 200" stroke="#f5deb3" stroke-width="4" opacity="0.5" fill="none"/>
  <path d="M230 215 Q270 185 310 215 Q350 245 390 215" stroke="#f5deb3" stroke-width="3" opacity="0.4" fill="none"/>
  <path d="M240 195 Q280 165 320 195 Q360 225 400 195" stroke="#deb887" stroke-width="3.5" opacity="0.45" fill="none"/>
  <!-- Sauce dots -->
  <circle cx="275" cy="210" r="5" fill="#cc3300" opacity="0.4"/>
  <circle cx="310" cy="200" r="6" fill="#cc3300" opacity="0.35"/>
  <circle cx="330" cy="215" r="4" fill="#cc3300" opacity="0.3"/>
  <!-- Basil leaves -->
  <ellipse cx="260" cy="190" rx="8" ry="5" fill="#228b22" opacity="0.5" transform="rotate(-30 260 190)"/>
  <ellipse cx="340" cy="195" rx="7" ry="4" fill="#2e8b57" opacity="0.4" transform="rotate(20 340 195)"/>
  <!-- Steam -->
  <path d="M280 160 Q285 140 290 160" stroke="#fff" stroke-width="2" opacity="0.2" fill="none"/>
  <path d="M305 155 Q310 135 315 155" stroke="#fff" stroke-width="2" opacity="0.2" fill="none"/>
  <!-- Rolling pin -->
  <rect x="160" y="90" width="120" height="12" rx="6" fill="#deb887" opacity="0.25"/>
  <rect x="145" y="88" width="20" height="16" rx="4" fill="#d2b48c" opacity="0.3"/>
  <rect x="275" y="88" width="20" height="16" rx="4" fill="#d2b48c" opacity="0.3"/>
  <!-- Text -->
  <text x="300" y="340" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">Handmade Pasta</text>
  <text x="300" y="365" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">Made Fresh Daily • Italian Tradition</text>
</svg>