<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad1)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3e2723;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d4037;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Wall paneling -->
  <rect x="50" y="50" width="500" height="250" rx="5" fill="#6d4c41" opacity="0.2" stroke="#8d6e63" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="175" y1="50" x2="175" y2="300" stroke="#8d6e63" stroke-width="1" opacity="0.2"/>
  <line x1="300" y1="50" x2="300" y2="300" stroke="#8d6e63" stroke-width="1" opacity="0.2"/>
  <line x1="425" y1="50" x2="425" y2="300" stroke="#8d6e63" stroke-width="1" opacity="0.2"/>
  <!-- Edison bulbs -->
  <line x1="150" y1="30" x2="150" y2="70" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
  <circle cx="150" cy="75" r="8" fill="#FFD700" opacity="0.4"/>
  <line x1="300" y1="25" x2="300" y2="65" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
  <circle cx="300" cy="70" r="8" fill="#FFD700" opacity="0.45"/>
  <line x1="450" y1="30" x2="450" y2="70" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
  <circle cx="450" cy="75" r="8" fill="#FFD700" opacity="0.4"/>
  <!-- Banquette -->
  <rect x="70" y="180" width="460" height="40" rx="8" fill="#8b4513" opacity="0.25"/>
  <!-- Tables -->
  <rect x="120" y="230" width="80" height="40" rx="5" fill="#fff" opacity="0.1"/>
  <rect x="260" y="230" width="80" height="40" rx="5" fill="#fff" opacity="0.1"/>
  <rect x="400" y="230" width="80" height="40" rx="5" fill="#fff" opacity="0.1"/>
  <!-- Candles on tables -->
  <rect x="156" y="222" width="4" height="10" fill="#FFD700" opacity="0.5"/>
  <circle cx="158" cy="220" r="3" fill="#ff6" opacity="0.4"/>
  <rect x="296" y="222" width="4" height="10" fill="#FFD700" opacity="0.5"/>
  <circle cx="298" cy="220" r="3" fill="#ff6" opacity="0.4"/>
  <rect x="436" y="222" width="4" height="10" fill="#FFD700" opacity="0.5"/>
  <circle cx="438" cy="220" r="3" fill="#ff6" opacity="0.4"/>
  <!-- Text -->
  <text x="300" y="340" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">The Main Dining Room</text>
  <text x="300" y="365" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">Seats 120 • Historic Elegance</text>
</svg>