<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad1)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Chandelier -->
  <rect x="290" y="30" width="20" height="30" fill="#c9a84c" opacity="0.4"/>
  <path d="M260 60 L340 60 L330 90 L270 90 Z" fill="#c9a84c" opacity="0.3"/>
  <circle cx="275" cy="95" r="5" fill="#FFD700" opacity="0.6"/>
  <circle cx="300" cy="100" r="6" fill="#FFD700" opacity="0.7"/>
  <circle cx="325" cy="95" r="5" fill="#FFD700" opacity="0.6"/>
  <!-- Round tables -->
  <ellipse cx="180" cy="240" rx="60" ry="30" fill="#fff" opacity="0.1"/>
  <ellipse cx="420" cy="240" rx="60" ry="30" fill="#fff" opacity="0.1"/>
  <ellipse cx="300" cy="200" rx="65" ry="32" fill="#fff" opacity="0.12"/>
  <!-- Chairs -->
  <circle cx="145" cy="220" r="8" fill="#fff" opacity="0.08"/>
  <circle cx="215" cy="220" r="8" fill="#fff" opacity="0.08"/>
  <circle cx="160" cy="265" r="8" fill="#fff" opacity="0.08"/>
  <circle cx="200" cy="265" r="8" fill="#fff" opacity="0.08"/>
  <circle cx="385" cy="220" r="8" fill="#fff" opacity="0.08"/>
  <circle cx="455" cy="220" r="8" fill="#fff" opacity="0.08"/>
  <!-- Uplighting beams -->
  <path d="M50 400 L80 100" stroke="#c9a84c" stroke-width="1" opacity="0.15"/>
  <path d="M550 400 L520 100" stroke="#c9a84c" stroke-width="1" opacity="0.15"/>
  <!-- Sparkle stars -->
  <circle cx="150" cy="80" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="450" cy="70" r="2" fill="#FFD700" opacity="0.4"/>
  <circle cx="500" cy="130" r="1.5" fill="#FFD700" opacity="0.3"/>
  <circle cx="100" cy="150" r="1.5" fill="#FFD700" opacity="0.3"/>
  <!-- Text -->
  <text x="300" y="340" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">Grand Ballroom Gala</text>
  <text x="300" y="365" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">300 Guests • Five-Course Menu</text>
</svg>