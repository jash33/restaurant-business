<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad3)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Menu card / book -->
  <rect x="180" y="80" width="240" height="240" rx="6" fill="#fff" opacity="0.12"/>
  <rect x="185" y="85" width="230" height="230" rx="4" fill="#fff" opacity="0.06"/>
  <!-- Menu spine -->
  <line x1="300" y1="80" x2="300" y2="320" stroke="#fff" stroke-width="1" opacity="0.15"/>
  <!-- Menu text lines (left page) -->
  <rect x="205" y="115" width="70" height="4" rx="2" fill="#fff" opacity="0.3"/>
  <rect x="205" y="135" width="60" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="205" y="148" width="65" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="205" y="161" width="55" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="205" y="185" width="70" height="4" rx="2" fill="#fff" opacity="0.3"/>
  <rect x="205" y="205" width="58" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="205" y="218" width="62" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="205" y="231" width="50" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <!-- Menu text lines (right page) -->
  <rect x="320" y="115" width="70" height="4" rx="2" fill="#fff" opacity="0.3"/>
  <rect x="320" y="135" width="55" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="320" y="148" width="65" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="320" y="161" width="60" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="320" y="185" width="70" height="4" rx="2" fill="#fff" opacity="0.3"/>
  <rect x="320" y="205" width="60" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="320" y="218" width="58" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <rect x="320" y="231" width="52" height="3" rx="1.5" fill="#fff" opacity="0.15"/>
  <!-- Season icons: leaf (fall), snowflake (winter), flower (spring), sun (summer) -->
  <!-- Leaf -->
  <path d="M120 120 Q140 100 160 120 Q140 130 120 120 Z" fill="#e67e22" opacity="0.5"/>
  <line x1="140" y1="108" x2="140" y2="125" stroke="#e67e22" stroke-width="1" opacity="0.4"/>
  <!-- Snowflake -->
  <g transform="translate(480, 120)" opacity="0.5">
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#aee" stroke-width="2"/>
    <line x1="-13" y1="-7.5" x2="13" y2="7.5" stroke="#aee" stroke-width="2"/>
    <line x1="-13" y1="7.5" x2="13" y2="-7.5" stroke="#aee" stroke-width="2"/>
  </g>
  <!-- Flower -->
  <g transform="translate(120, 280)" opacity="0.5">
    <circle cx="0" cy="-8" r="5" fill="#e91e63"/>
    <circle cx="8" cy="0" r="5" fill="#e91e63"/>
    <circle cx="0" cy="8" r="5" fill="#e91e63"/>
    <circle cx="-8" cy="0" r="5" fill="#e91e63"/>
    <circle cx="0" cy="0" r="4" fill="#FFD700"/>
  </g>
  <!-- Sun -->
  <g transform="translate(480, 280)" opacity="0.5">
    <circle cx="0" cy="0" r="10" fill="#f39c12"/>
    <line x1="0" y1="-18" x2="0" y2="-13" stroke="#f39c12" stroke-width="2"/>
    <line x1="0" y1="13" x2="0" y2="18" stroke="#f39c12" stroke-width="2"/>
    <line x1="-18" y1="0" x2="-13" y2="0" stroke="#f39c12" stroke-width="2"/>
    <line x1="13" y1="0" x2="18" y2="0" stroke="#f39c12" stroke-width="2"/>
  </g>
  <!-- Text -->
  <text x="300" y="355" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">Seasonal Menus</text>
  <text x="300" y="380" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">Fresh Flavors, Every Season</text>
</svg>