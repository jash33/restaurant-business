<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad1)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a3728;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Stone arch -->
  <path d="M100 300 L100 120 Q100 50 300 50 Q500 50 500 120 L500 300" stroke="#8b7355" stroke-width="4" opacity="0.25" fill="none"/>
  <!-- Wine racks (left) -->
  <rect x="60" y="80" width="80" height="200" fill="#5c3317" opacity="0.15" rx="3"/>
  <line x1="60" y1="120" x2="140" y2="120" stroke="#8b6914" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="160" x2="140" y2="160" stroke="#8b6914" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="200" x2="140" y2="200" stroke="#8b6914" stroke-width="1" opacity="0.2"/>
  <line x1="60" y1="240" x2="140" y2="240" stroke="#8b6914" stroke-width="1" opacity="0.2"/>
  <!-- Wine bottles left rack -->
  <ellipse cx="80" cy="100" rx="8" ry="3" fill="#006400" opacity="0.2"/>
  <ellipse cx="110" cy="100" rx="8" ry="3" fill="#8b0000" opacity="0.2"/>
  <ellipse cx="80" cy="140" rx="8" ry="3" fill="#8b0000" opacity="0.2"/>
  <ellipse cx="110" cy="140" rx="8" ry="3" fill="#daa520" opacity="0.15"/>
  <ellipse cx="80" cy="180" rx="8" ry="3" fill="#006400" opacity="0.2"/>
  <ellipse cx="110" cy="180" rx="8" ry="3" fill="#8b0000" opacity="0.2"/>
  <ellipse cx="80" cy="220" rx="8" ry="3" fill="#daa520" opacity="0.15"/>
  <ellipse cx="110" cy="220" rx="8" ry="3" fill="#006400" opacity="0.2"/>
  <!-- Wine racks (right) -->
  <rect x="460" y="80" width="80" height="200" fill="#5c3317" opacity="0.15" rx="3"/>
  <line x1="460" y1="120" x2="540" y2="120" stroke="#8b6914" stroke-width="1" opacity="0.2"/>
  <line x1="460" y1="160" x2="540" y2="160" stroke="#8b6914" stroke-width="1" opacity="0.2"/>
  <line x1="460" y1="200" x2="540" y2="200" stroke="#8b6914" stroke-width="1" opacity="0.2"/>
  <line x1="460" y1="240" x2="540" y2="240" stroke="#8b6914" stroke-width="1" opacity="0.2"/>
  <!-- Wine bottles right rack -->
  <ellipse cx="480" cy="100" rx="8" ry="3" fill="#8b0000" opacity="0.2"/>
  <ellipse cx="510" cy="100" rx="8" ry="3" fill="#006400" opacity="0.2"/>
  <ellipse cx="480" cy="140" rx="8" ry="3" fill="#daa520" opacity="0.15"/>
  <ellipse cx="510" cy="140" rx="8" ry="3" fill="#8b0000" opacity="0.2"/>
  <ellipse cx="480" cy="180" rx="8" ry="3" fill="#8b0000" opacity="0.2"/>
  <ellipse cx="510" cy="180" rx="8" ry="3" fill="#006400" opacity="0.2"/>
  <!-- Long dining table -->
  <rect x="180" y="210" width="240" height="60" rx="5" fill="#5c3317" opacity="0.2"/>
  <!-- Chairs -->
  <rect x="190" y="195" width="15" height="20" rx="3" fill="#5c3317" opacity="0.15"/>
  <rect x="220" y="195" width="15" height="20" rx="3" fill="#5c3317" opacity="0.15"/>
  <rect x="365" y="195" width="15" height="20" rx="3" fill="#5c3317" opacity="0.15"/>
  <rect x="395" y="195" width="15" height="20" rx="3" fill="#5c3317" opacity="0.15"/>
  <!-- Chandelier -->
  <line x1="300" y1="50" x2="300" y2="100" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
  <circle cx="285" cy="105" r="4" fill="#FFD700" opacity="0.4"/>
  <circle cx="300" cy="108" r="5" fill="#FFD700" opacity="0.5"/>
  <circle cx="315" cy="105" r="4" fill="#FFD700" opacity="0.4"/>
  <!-- Warm glow -->
  <circle cx="300" cy="200" r="60" fill="#FFD700" opacity="0.04"/>
  <!-- Text -->
  <text x="300" y="340" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">The Wine Cellar</text>
  <text x="300" y="365" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">500+ Wines • Private Dining</text>
</svg>