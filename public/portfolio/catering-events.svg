<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad2)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b2fa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Long banquet table -->
  <rect x="80" y="180" width="440" height="80" rx="8" fill="#fff" opacity="0.12"/>
  <!-- Table cloth drape -->
  <path d="M80 260 Q80 280 100 280 L500 280 Q520 280 520 260" fill="#fff" opacity="0.08"/>
  <!-- Plates on table -->
  <circle cx="160" cy="210" r="22" fill="#fff" opacity="0.2"/>
  <circle cx="240" cy="210" r="22" fill="#fff" opacity="0.2"/>
  <circle cx="320" cy="210" r="22" fill="#fff" opacity="0.2"/>
  <circle cx="400" cy="210" r="22" fill="#fff" opacity="0.2"/>
  <!-- Candles -->
  <rect x="195" y="155" width="6" height="30" rx="3" fill="#FFD700" opacity="0.6"/>
  <ellipse cx="198" cy="150" rx="5" ry="8" fill="#FF6B35" opacity="0.7"/>
  <rect x="355" y="155" width="6" height="30" rx="3" fill="#FFD700" opacity="0.6"/>
  <ellipse cx="358" cy="150" rx="5" ry="8" fill="#FF6B35" opacity="0.7"/>
  <!-- Wine glasses -->
  <path d="M275 165 L275 185 M268 185 L282 185" stroke="#fff" stroke-width="2" opacity="0.3"/>
  <path d="M267 145 Q275 170 283 145" stroke="#fff" stroke-width="2" opacity="0.3" fill="none"/>
  <!-- Champagne bubbles -->
  <circle cx="275" cy="135" r="2" fill="#fff" opacity="0.2"/>
  <circle cx="278" cy="128" r="1.5" fill="#fff" opacity="0.15"/>
  <circle cx="272" cy="125" r="1" fill="#fff" opacity="0.1"/>
  <!-- Decorative string lights -->
  <path d="M60 80 Q150 100 300 85 Q450 70 540 90" stroke="#FFD700" stroke-width="1.5" opacity="0.3" fill="none"/>
  <circle cx="120" cy="92" r="4" fill="#FFD700" opacity="0.5"/>
  <circle cx="200" cy="88" r="4" fill="#FFD700" opacity="0.5"/>
  <circle cx="300" cy="85" r="4" fill="#FFD700" opacity="0.5"/>
  <circle cx="400" cy="82" r="4" fill="#FFD700" opacity="0.5"/>
  <circle cx="480" cy="87" r="4" fill="#FFD700" opacity="0.5"/>
  <!-- Text -->
  <text x="300" y="335" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">Catering &amp; Events</text>
  <text x="300" y="360" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">Unforgettable Celebrations</text>
</svg>