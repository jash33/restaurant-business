<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#1a1a2e"/>
  <rect x="0" y="0" width="600" height="400" fill="url(#grad1)" opacity="0.8"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#302b63;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- City skyline -->
  <rect x="50" y="100" width="40" height="120" fill="#fff" opacity="0.08"/>
  <rect x="100" y="80" width="30" height="140" fill="#fff" opacity="0.06"/>
  <rect x="140" y="110" width="35" height="110" fill="#fff" opacity="0.07"/>
  <rect x="420" y="90" width="45" height="130" fill="#fff" opacity="0.07"/>
  <rect x="475" y="105" width="30" height="115" fill="#fff" opacity="0.06"/>
  <rect x="515" y="85" width="35" height="135" fill="#fff" opacity="0.08"/>
  <!-- Building windows -->
  <rect x="58" y="110" width="5" height="5" fill="#ff6" opacity="0.2"/>
  <rect x="72" y="110" width="5" height="5" fill="#ff6" opacity="0.15"/>
  <rect x="58" y="130" width="5" height="5" fill="#ff6" opacity="0.18"/>
  <rect x="430" y="100" width="5" height="5" fill="#ff6" opacity="0.2"/>
  <rect x="445" y="115" width="5" height="5" fill="#ff6" opacity="0.15"/>
  <!-- String lights -->
  <path d="M100 160 Q200 140 300 160 Q400 180 500 160" stroke="#FFD700" stroke-width="1" opacity="0.4" fill="none"/>
  <circle cx="150" cy="153" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="225" cy="152" r="3" fill="#FFD700" opacity="0.5"/>
  <circle cx="300" cy="160" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="375" cy="167" r="3" fill="#FFD700" opacity="0.5"/>
  <circle cx="450" cy="163" r="3" fill="#FFD700" opacity="0.6"/>
  <!-- Terrace railing -->
  <rect x="80" y="220" width="440" height="4" fill="#fff" opacity="0.15"/>
  <rect x="80" y="220" width="3" height="50" fill="#fff" opacity="0.1"/>
  <rect x="200" y="220" width="3" height="50" fill="#fff" opacity="0.1"/>
  <rect x="320" y="220" width="3" height="50" fill="#fff" opacity="0.1"/>
  <rect x="517" y="220" width="3" height="50" fill="#fff" opacity="0.1"/>
  <!-- Tables -->
  <ellipse cx="250" cy="260" rx="35" ry="18" fill="#fff" opacity="0.08"/>
  <ellipse cx="400" cy="260" rx="35" ry="18" fill="#fff" opacity="0.08"/>
  <!-- Candle glow -->
  <circle cx="250" cy="255" r="5" fill="#FFD700" opacity="0.3"/>
  <circle cx="400" cy="255" r="5" fill="#FFD700" opacity="0.3"/>
  <!-- Stars -->
  <circle cx="200" cy="40" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="350" cy="30" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="480" cy="45" r="1.5" fill="#fff" opacity="0.35"/>
  <circle cx="120" cy="55" r="1" fill="#fff" opacity="0.25"/>
  <!-- Text -->
  <text x="300" y="340" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="22" font-weight="bold" opacity="0.9">The Rooftop Terrace</text>
  <text x="300" y="365" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" opacity="0.6">Skyline Views • Al Fresco Dining</text>
</svg>